services:
  coturn:
    image: coturn/coturn:4.7.0
    restart: unless-stopped
    network_mode: host
    command:
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SHARED_SECRET:?TURN_SHARED_SECRET is required}
      - --realm=turn.spilled.overload.studio
      - --server-name=turn.spilled.overload.studio
      - --listening-port=3478
      - --tls-listening-port=5349
      - --min-port=49160
      - --max-port=49260
      - --no-cli
      - --no-multicast-peers
      - --no-loopback-peers
      - --stale-nonce=600
      - --cert=/run/secrets/turn_cert
      - --pkey=/run/secrets/turn_key
    secrets:
      - turn_cert
      - turn_key

secrets:
  turn_cert:
    file: ${TURN_CERT_FILE:?TURN_CERT_FILE is required}
  turn_key:
    file: ${TURN_KEY_FILE:?TURN_KEY_FILE is required}
